[buildout]
# Copy this file to `secrets.local.cfg` and replace the placeholder values.
# `buildout.cfg` loads `secrets.local.cfg` via `optional-extends`, so the file
# is applied automatically when present.
#
# Keep `secrets.local.cfg` out of version control. Only this example file should
# be committed.
#
# These values are forwarded to the Zope instance as environment variables:
# - `site-id` -> `SITE_ID`
# - `omnia-core-api-url` -> `OMNIA_CORE_API_URL`
# - `omnia-openai-api-url` -> `OMNIA_OPENAI_API_URL`
# - `omnia-application-id` -> `OMNIA_APPLICATION_ID`
# - `omnia-organization-id` -> `OMNIA_ORGANIZATION_ID`
site-id = CHANGE_ME
omnia-core-api-url = CHANGE_ME
omnia-openai-api-url = CHANGE_ME
omnia-application-id = CHANGE_ME
omnia-organization-id = CHANGE_ME