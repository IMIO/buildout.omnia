[buildout]
extends =
    https://dist.plone.org/release/6.2-latest/versions.cfg
    https://dist.plone.org/release/6.2-latest/versions-ecosystem.cfg
    https://raw.github.com/collective/buildout.plonetest/master/qa.cfg
    sources.cfg
optional-extends =
    secrets.local.cfg

extensions =
    mr.developer

find-links =
    https://dist.plone.org/release/6.2-latest/

parts =
	instance
	test
	omelette

auto-checkout =
    imio.omnia.core
    imio.omnia.tinymce
    imio.omnia.assistant
    collective.fingerpointing
    imio.helpers

eggs =
	imio.omnia.core [test]
    imio.omnia.tinymce
    imio.omnia.assistant
    imio.helpers
    collective.fingerpointing
    iw.debug
    plone.app.debugtoolbar

zcml =
  iw.debug

show-picked-versions = true

plone-user = admin:admin

develop =
    src/imio.omnia.core
    src/imio.omnia.tinymce
    src/imio.omnia.assistant

[instance]
initialization = import shutup; shutup.please()
recipe = plone.recipe.zope2instance
user = ${buildout:plone-user}
eggs =
    Plone
    plone.app.upgrade
    ${buildout:eggs}
zodb-temporary-storage = off
deprecation-warnings = on
environment-vars =
    zope_i18n_compile_mo_files true
    SITE_ID ${buildout:site-id}
    OMNIA_CORE_API_URL ${buildout:omnia-core-api-url}
    OMNIA_OPENAI_API_URL ${buildout:omnia-openai-api-url}
    OMNIA_APPLICATION_ID ${buildout:omnia-application-id}
    OMNIA_ORGANIZATION_ID ${buildout:omnia-organization-id}
zcml =
    ${buildout:zcml}


[test]
recipe = zc.recipe.testrunner
eggs = ${instance:eggs}
initialization =
    import shutup; shutup.please()
    os.environ['TZ'] = 'UTC'
defaults = ['-s', 'imio.omnia.core', '--auto-color', '--auto-progress']


[omelette]
recipe = collective.recipe.omelette
eggs = ${instance:eggs}

[versions]
httpx2 = 2.9.1
httpcore2 = 2.9.1
truststore = 0.10.4
